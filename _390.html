<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>390px 확인 — 패밀리 탭</title>
<style>
  body{margin:0;background:#EEE7DC;font-family:-apple-system,'Malgun Gothic','Noto Sans KR',sans-serif;padding:16px}
  .wrap{display:flex;gap:14px;align-items:flex-start}
  .dev{background:#fff;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.12);overflow:hidden;flex:0 0 auto}
  .dev p{margin:0;padding:7px 11px;font-size:11.5px;color:#6C5B50;background:#FAF5EE;border-bottom:1px solid #EFE4D4}
  iframe{display:block;width:390px;height:860px;border:0}
</style>
</head>
<body>
  <div class="wrap">
    <div class="dev">
      <p>390px · 위</p>
      <iframe src="index.html?r=390#family" title="390px 미리보기 1"></iframe>
    </div>
    <div class="dev">
      <p>390px · 중간</p>
      <iframe class="sc" data-y="1150" src="index.html?r=390b#family" title="390px 미리보기 2"></iframe>
    </div>
    <div class="dev">
      <p>390px · 일정·메모</p>
      <iframe class="sc" data-y="2150" src="index.html?r=390c#family" title="390px 미리보기 3"></iframe>
    </div>
  </div>
<script>
  Array.prototype.forEach.call(document.querySelectorAll('iframe.sc'), function(f){
    f.addEventListener('load', function(){
      var y = parseInt(f.getAttribute('data-y'), 10) || 0;
      setTimeout(function(){ try { f.contentWindow.scrollTo(0, y); } catch (e) {} }, 1200);
    });
  });
</script>
</body>
</html>
