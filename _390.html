<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>390px 확인 — 패밀리 탭</title>
<style>
  body{margin:0;background:#EEE7DC;font-family:-apple-system,'Malgun Gothic','Noto Sans KR',sans-serif;padding:16px}
  .wrap{display:flex;gap:20px;align-items:flex-start}
  .dev{background:#fff;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.12);overflow:hidden;flex:0 0 auto}
  .dev p{margin:0;padding:8px 12px;font-size:12px;color:#6C5B50;background:#FAF5EE;border-bottom:1px solid #EFE4D4}
  iframe{display:block;width:390px;height:900px;border:0}
</style>
</head>
<body>
  <div class="wrap">
    <div class="dev">
      <p>390px · 패밀리 탭 위쪽 (임시 확인용, 확인 후 삭제)</p>
      <iframe src="index.html?r=390#family" title="390px 미리보기 1"></iframe>
    </div>
    <div class="dev">
      <p>390px · 패밀리 탭 일정·메모 (스크롤)</p>
      <iframe id="scrolled" src="index.html?r=390b#family" title="390px 미리보기 2"></iframe>
    </div>
  </div>
<script>
  var f = document.getElementById('scrolled');
  f.addEventListener('load', function(){
    try { f.contentWindow.scrollTo(0, 1180); } catch (e) {}
  });
</script>
</body>
</html>
